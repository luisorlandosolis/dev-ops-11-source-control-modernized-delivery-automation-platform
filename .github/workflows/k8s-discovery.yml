# Public portfolio example
# Environment-specific usernames, hostnames, and IP addresses
# have been sanitized for publication.

name: Kubernetes Discovery

on:
  workflow_dispatch:

jobs:
  cluster-check:
    runs-on: [self-hosted, jumpbox]

    steps:
      - name: Show Hostname
        run: hostname

      - name: Show Current User
        run: whoami

      - name: Show Kubernetes Nodes
        run: ssh automation-user@kubernetes-management-host "kubectl get nodes"

      - name: Show All Pods
        run: ssh automation-user@kubernetes-management-host "kubectl get pods -A"

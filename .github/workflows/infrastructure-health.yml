name: Infrastructure Health

on:
  workflow_dispatch:

jobs:
  infrastructure-health:
    runs-on:
      - self-hosted
      - arc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ARC Environment Check
        run: |
          echo "=== USER ==="
          whoami

          echo
          echo "=== ID ==="
          id

          echo
          echo "=== PYTHON ==="
          python3 --version

          echo
          echo "=== PIP ==="
          python3 -m pip --version || true

          echo
          echo "=== SUDO ==="
          which sudo || true

          echo
          echo "=== APT ==="
          which apt-get || true

          echo
          echo "=== OS ==="
          cat /etc/os-release || true

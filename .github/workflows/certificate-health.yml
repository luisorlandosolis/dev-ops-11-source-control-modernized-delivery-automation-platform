name: Certificate Health

on:
  workflow_dispatch:

jobs:
  certificate-health:
    runs-on: self-hosted

    steps:
      - name: Runner Validation
        run: |
          echo "===== Runner Validation ====="

          hostname
          whoami

          echo ""
          echo "===== Tool Validation ====="

          which kubectl || echo "kubectl not installed"
          which git || echo "git installed"
          which bash || echo "bash installed"

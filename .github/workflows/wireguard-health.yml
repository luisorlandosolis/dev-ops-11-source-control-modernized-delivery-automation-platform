name: WireGuard Health

on:
  workflow_dispatch:

jobs:
  wireguard-health:
    runs-on:
      - self-hosted
      - jumpbox

    steps:
      - name: Show Hostname
        run: hostname

      - name: Show Date
        run: date

      - name: Enumerate WireGuard Inventory
        run: |
          echo "===== WireGuard Inventory ====="

          ansible-vault view ~/ansible/inventory.ini \
            --vault-password-file ~/.vault_pass > /tmp/inventory.txt

          echo ""
          echo "SERVERS"
          echo "-------"

          awk '
          /^\[wg_servers\]/ {s=1; next}
          /^\[/ {if(s){exit}}
          s && NF && $1 !~ /^#/ {print}
          ' /tmp/inventory.txt

          echo ""
          echo "CLIENTS"
          echo "-------"

          awk '
          /^\[wg_clients\]/ {s=1; next}
          /^\[/ {if(s){exit}}
          s && NF && $1 !~ /^#/ {print}
          ' /tmp/inventory.txt

          rm -f /tmp/inventory.txt

      - name: Check WireGuard Health
        run: |
          echo "===== WireGuard Health ====="

          LAST_HANDSHAKE=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')

          NOW=$(date +%s)
          AGE=$((NOW - LAST_HANDSHAKE))

          echo "Last Handshake Age: ${AGE} seconds"

          mkdir -p ~/monitoring

          if [ "$LAST_HANDSHAKE" = "0" ]; then
            STATUS="CRITICAL"

            echo "STATUS: $STATUS"

            echo "{\"status\":\"$STATUS\",\"age\":$AGE}" \
              > ~/monitoring/wireguard-health.json

            exit 1

          elif [ $AGE -lt 300 ]; then
            STATUS="HEALTHY"

            echo "STATUS: $STATUS"

            echo "{\"status\":\"$STATUS\",\"age\":$AGE}" \
              > ~/monitoring/wireguard-health.json

          elif [ $AGE -lt 900 ]; then
            STATUS="WARNING"

            echo "STATUS: $STATUS"

            echo "{\"status\":\"$STATUS\",\"age\":$AGE}" \
              > ~/monitoring/wireguard-health.json

          else
            STATUS="CRITICAL"

            echo "STATUS: $STATUS"

            echo "{\"status\":\"$STATUS\",\"age\":$AGE}" \
              > ~/monitoring/wireguard-health.json

            exit 1
          fi

